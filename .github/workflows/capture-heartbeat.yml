name: Capture heartbeat

# Free, Mac- and phone-independent monitor. Vercel's Hobby plan caps crons at
# once per day, so this GitHub Actions schedule hits the same endpoint more
# often for tighter detection. The endpoint runs two checks and decides whether
# to alert: transaction silence (>8h) and phone-heartbeat silence (>90m).
#
# Every 30m is set by the phone check: the iPhone automations ping every ~30m
# and the threshold is 90m, so this cadence puts detection at 90-120m plus
# whatever GitHub's scheduler adds. A slower cadence would blow the 90m target;
# a faster one buys little, since GitHub delays scheduled runs under load
# anyway (observed: up to ~40m late on this repo).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit capture-check endpoint
        run: curl -fsS -m 30 https://sikka-mauve.vercel.app/api/health/capture-check
